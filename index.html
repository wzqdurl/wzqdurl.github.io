<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4riis</title>
  <style>
    :root { --red: #b91c1c; --bg: #050505; --text: #d4d4d4; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .container { max-width: 500px; width: 100%; text-align: center; border: 1px solid #222; padding: 40px; margin-top: 50px; }
    h1 { color: var(--red); font-size: 2rem; margin-bottom: 5px; }
    .bio { font-size: 0.9rem; color: #71717a; margin-bottom: 30px; }
    .links { display: flex; flex-direction: column; gap: 15px; }
    a {
      display: block;
      color: #fff;
      text-decoration: none;
      border: 1px solid var(--red);
      padding: 12px;
      transition: 0.3s;
    }
    a:hover { background: var(--red); color: #000; }
    .glitch { animation: glitch 2s infinite; }
    @keyframes glitch { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
  </style>
</head>
<body>
  <div class="container glitch">
    <h1>4riis</h1>
    <p class="bio">Experimentando con sistemas / Dev & Creator</p>
    <div class="links">
      <a href="https://github.com/wzqdurl" target="_blank">GitHub</a>
      <a href="https://discord.com/users/sleewpi." target="_blank">Discord: sleewpi.</a>
      <a href="https://youtube.com/@sleepi" target="_blank">YouTube: sleepi</a>
    </div>
  </div>
</body>
</html>
